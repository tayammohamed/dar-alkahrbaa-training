<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dar Alkahrbaa Training Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#171B47">
<meta property="og:title" content="Dar Alkahrbaa Training Center — مركز دار الكهرباء للتدريب">
<meta property="og:description" content="Hands-on training for engineers and engineering students. 15,000+ graduates. Part of Dar Alkahrbaa.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/banner.jpg">
<meta name="description" content="Dar Alkahrbaa Training Center prepares fresh graduate engineers and final-year students for the job market. Part of Dar Alkahrbaa.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Calm catalog: white page, light-grey alternating bands, near-black type, navy brand buttons.
   One typeface, generous whitespace, no effects. Modeled on a quiet institute site. */
:root{
  --bg:#FFFFFF; --band:#F3F3F4; --surface:#FFFFFF; --ink:#0E0F1A; --ink-2:#3A3C4A; --muted:#6E7080; --soft:#9A9CA8;
  --line:#E6E6EA; --line-2:#D4D4DA;
  --brand:#171B47; --brand-ink:#FFFFFF; --gold:#F2B705; --wa:#1FAF55;
  --f:'Plus Jakarta Sans','Segoe UI',Tahoma,sans-serif;
  --fd:'Bebas Neue','Plus Jakarta Sans',Impact,sans-serif;
  --fh:'Plus Jakarta Sans','Segoe UI',sans-serif;
  --r:16px; --r-s:10px; --maxw:1140px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.3;font-weight:800;text-wrap:balance;font-family:var(--fh);letter-spacing:-.01em}
h1,h2{font-family:var(--fd);font-weight:400;line-height:.98;letter-spacing:.01em}
:root[lang="ar"]{--f:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--fd:'Alexandria','IBM Plex Sans Arabic',sans-serif;--fh:'Alexandria','IBM Plex Sans Arabic',sans-serif}
:root[lang="ar"] h1,:root[lang="ar"] h2{font-weight:800;line-height:1.3;letter-spacing:0}
p{margin:0}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,8vw,96px)}
.band{background:var(--band)}
.head{text-align:center;max-width:680px;margin:0 auto 44px}
.head h2{font-size:clamp(40px,5vw,60px)}
:root[lang="ar"] .head h2{font-size:clamp(28px,3.6vw,42px)}
.head p{color:var(--muted);margin-top:10px;font-size:16.5px}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.btn-p{background:var(--brand);color:var(--brand-ink)}
.btn-p:hover{background:#0E1133}
.btn-o{border:1.5px solid var(--ink);color:var(--ink);background:var(--bg)}
.btn-o:hover{background:var(--band)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:#18964A}
.btn-s{min-height:40px;padding:0 18px;font-size:14px}
.btn-b{width:100%}

/* header */
.ann{background:var(--brand);color:#fff;font-size:13.5px;text-align:center;padding-block:7px}
.ann a{text-decoration:underline;text-underline-offset:3px;margin-inline-start:6px;color:var(--gold)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:72px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .logo{height:52px;width:auto}
.brand b{display:block;font-size:17px;line-height:1.15;font-family:var(--fh);font-weight:800}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;gap:22px}
.nav a{font-size:15px;color:var(--ink-2);padding-block:6px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-color:var(--ink)}
.hdr-cta{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);place-items:center}
@media (max-width:1000px){.nav,.hdr-cta .hide-m{display:none}.burger{display:grid}}
.drawer{position:fixed;inset:0;z-index:80;background:rgba(14,15,26,.4);display:flex}
.drawer-in{width:min(320px,86vw);height:100%;background:var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) 20px 24px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.drawer-in a{padding:12px 10px;border-bottom:1px solid var(--line);font-weight:500}

/* hero */
.hero{padding-block:clamp(64px,10vw,120px) clamp(56px,8vw,96px);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.7fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(56px,8.4vw,112px);line-height:.92;letter-spacing:.005em}
:root[lang="ar"] .hero h1{font-size:clamp(36px,5.2vw,62px);line-height:1.25;letter-spacing:0}
.hero h1 .soft{color:var(--soft)}
.hero .lede{color:var(--ink-2);font-size:18px;margin-top:22px;max-width:46ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hero-art{position:relative;display:grid;place-items:center}
.hero-art img{position:relative;width:min(400px,100%);height:auto;animation:float 7s ease-in-out infinite}
.hero-art .glow{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(242,183,5,.28),rgba(242,183,5,0) 68%);top:52%;left:50%;transform:translate(-50%,-50%);animation:glow 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes glow{50%{opacity:.45;transform:translate(-50%,-50%) scale(1.08)}}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-art{order:-1;justify-self:center}.hero-art img{width:190px}}
/* entrance + scroll reveal (content is visible by default; only below-the-fold blocks wait for scroll) */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero h1,.hero .lede,.hero .ctas,.hero-art{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.hero .lede{animation-delay:.12s}.hero .ctas{animation-delay:.22s}.hero-art{animation-delay:.1s}
.rv{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.pre{opacity:0;transform:translateY(22px)}
.hdr{transition:box-shadow .25s}
.hdr.scrolled{box-shadow:0 6px 20px -14px rgba(14,15,26,.35)}
.btn .icon{transition:transform .2s}
.btn .ia{transition:translate .2s}
.btn:hover .ia{translate:3px 0}
[dir="rtl"] .btn:hover .ia{translate:-3px 0}
[dir="rtl"] .ia{transform:scaleX(-1)}
.card,.cat,.rev,.why div{transition:transform .25s ease,box-shadow .25s ease,border-color .2s,opacity .6s ease}
.card:hover,.cat:hover,.rev:hover{transform:translateY(-4px);box-shadow:0 18px 36px -24px rgba(14,15,26,.35)}
.fab-wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation:ping 2.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
.pop{animation:up .25s ease both}
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mtrack{display:flex;gap:14px;width:max-content;animation:mq 40s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.mtrack div{display:flex;align-items:center;justify-content:center;min-height:84px;padding:14px 28px;border:1px solid var(--line);border-radius:var(--r-s);font-weight:600;font-size:14.5px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.mtrack img{max-height:48px;width:auto}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}
[dir="rtl"] .mtrack{animation-name:mqr}

/* category cards (like "For Individuals / For Organizations") */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1100px){.cats{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.cats{grid-template-columns:1fr}}
.cat{display:flex;flex-direction:column;gap:10px;padding:30px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cat h3{font-size:21px}
.cat p{color:var(--muted);font-size:15px;min-height:3.4em}
.cat .stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
@media (max-width:900px){.cats{grid-template-columns:1fr}}

/* course cards */
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;transition:border-color .2s}
.card:hover{border-color:var(--line-2)}
.card-b{display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;flex:1}
.card-b h3{font-size:18px}
.card-b .sub{color:var(--muted);font-size:14px;margin-top:-4px}
.facts{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2);padding-block:12px;border-block:1px solid var(--line)}
.facts span{display:flex;align-items:center;gap:8px}
.facts .icon{width:16px;height:16px;color:var(--soft)}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.price b{font-size:19px}
.price small{font-size:12.5px;color:var(--muted);margin-inline-start:4px}
.price s{display:block;font-size:12.5px;color:var(--soft)}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--band);color:var(--ink-2);white-space:nowrap}
.tag.open{background:#E7F6EC;color:#16733B}
.tag.soon{background:#FFF4D6;color:#8A6200}
.tag.done,.tag.closed{background:var(--band);color:var(--muted)}

/* poster: one flat colour, the round number, the title */
/* poster: real image when uploaded, otherwise the academy's poster layout (white, crest, ROUND N, Arabic line, APPLY NOW) */
.poster{container-type:inline-size;position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:#fff;border-bottom:1px solid var(--line)}
.poster.img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .poster.img img{transform:scale(1.035)}
.poster.gen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 16px 28px;color:#262A5C}
.poster .dar{position:absolute;top:2px;left:6px;font-family:'Bebas Neue',Impact,sans-serif;font-size:19cqw;line-height:.88;color:transparent;-webkit-text-stroke:1px #E3E4EC;text-align:left;direction:ltr;pointer-events:none}
.poster .dar.d2{top:auto;bottom:2px;left:auto;right:6px;text-align:right}
.poster .pl{position:relative;width:38%;height:auto}
.poster .season{position:relative;direction:ltr;font-size:5.2cqw;font-weight:500;margin-top:2cqw;align-self:flex-start;padding-inline-start:8%}
.poster .season b{color:#F2B705;font-weight:500}
.poster .en{position:relative;direction:ltr;font-family:'Bebas Neue',Impact,sans-serif;font-size:21cqw;line-height:.88;letter-spacing:.01em;white-space:nowrap}
.poster .ar{position:relative;font-size:7cqw;font-weight:500;margin-top:1.5cqw;white-space:nowrap}
.poster .ar b{color:#F2B705;font-weight:600}
.poster .md{position:relative;direction:ltr;font-size:4.6cqw;font-weight:600;margin-top:2px}
.poster .apply{position:relative;margin-top:10px;background:#262A5C;color:#fff;font-weight:700;font-size:11.5px;padding:5px 16px;letter-spacing:.06em;direction:ltr;clip-path:polygon(2% 0,100% 8%,98% 100%,0 92%)}
.poster .handle{position:absolute;bottom:7px;left:10px;font-size:10px;color:#77798C;direction:ltr}
.ribbon{position:absolute;top:16px;left:-36px;transform:rotate(-45deg);background:#F2B705;color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;padding:4px 44px;z-index:2;direction:ltr}
.poster .ft b{font-size:18px}

/* reviews */
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rev{display:flex;flex-direction:column;gap:16px;padding:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:0}
.stars{display:flex;gap:3px;color:var(--gold)}
.stars svg{width:17px;height:17px;fill:currentColor}
.stars .off{color:var(--line-2)}
.rev p{color:var(--ink-2);font-size:16px;line-height:1.85}
.who{display:flex;align-items:center;gap:12px;margin-top:auto}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--band);flex:none;font-size:14px}
.who b{display:block;font-size:14.5px}
.who small{color:var(--muted);font-size:12.5px}
@media (max-width:960px){.reviews{grid-template-columns:1fr}}

/* impact numbers */
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;text-align:center}
.nums b{display:block;font-size:clamp(34px,4vw,48px);font-weight:700;line-height:1.1}
.nums span{display:block;font-weight:600;margin-top:12px}
.nums small{color:var(--muted);font-size:13.5px}
@media (max-width:860px){.nums{grid-template-columns:repeat(2,1fr);gap:36px 20px}.nums div:last-child{grid-column:1/-1}}

/* why */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.why div{padding:26px;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.why h4{font-size:17px;margin-bottom:8px}
.why p{color:var(--muted);font-size:14.5px}
@media (max-width:960px){.why{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.why{grid-template-columns:1fr}}

/* history table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{padding:14px 20px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:13px;font-weight:600;color:var(--muted);background:var(--band)}
tr:last-child td{border-bottom:0}

/* partners */
.partners{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.partners div{display:flex;align-items:center;justify-content:center;text-align:center;min-height:84px;padding:14px;border:1px solid var(--line);border-radius:var(--r-s);font-weight:600;font-size:14.5px;color:var(--ink-2);background:var(--surface)}
.partners img{max-height:48px;width:auto}
@media (max-width:760px){.partners{grid-template-columns:1fr 1fr}}

/* faq */
.faq{max-width:780px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.qa{border-radius:var(--r-s);background:var(--surface);border:1px solid var(--line)}
.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 22px;font-weight:600}
.qa summary::-webkit-details-marker{display:none}
.qa summary .icon{transition:transform .2s;color:var(--muted)}
.qa[open] summary .icon{transform:rotate(180deg)}
.qa p{padding:0 22px 20px;color:var(--muted)}

/* footer */
.ftr{border-top:1px solid var(--line);padding-block:56px 40px}
.ftr-g{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:30px}
.ftr h5{font-size:14px;margin:0 0 12px}
.ftr a{display:block;padding-block:4px;font-size:14.5px;color:var(--muted)}
.ftr a:hover{color:var(--ink)}
.ftr .note{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@media (max-width:820px){.ftr-g{grid-template-columns:1fr 1fr}}
.ftr-g>div{min-width:0}
.social{flex-wrap:wrap}
@media (max-width:560px){.ftr-g{grid-template-columns:1fr}}

/* inner pages */
.phead{padding-block:clamp(44px,6vw,72px) 28px}
.phead h1{font-size:clamp(30px,4.6vw,48px);margin-top:10px}
.phead p{color:var(--muted);max-width:60ch;margin-top:12px;font-size:16.5px}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;font-weight:500;color:var(--ink-2);background:var(--bg)}
.pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters select{height:40px;border-radius:999px;border:1px solid var(--line-2);padding:0 14px;background:var(--bg);font-size:14px}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:40px;border-radius:999px;border:1px solid var(--line-2);margin-inline-start:auto;min-width:220px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
@media (max-width:640px){.search{margin-inline-start:0;width:100%}}

/* course detail */
.cd{display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start}
.cd-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
.cd-side .poster{border-radius:var(--r)}
.box{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14.5px;margin:0 0 20px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:end}
.cd h1{font-size:clamp(30px,4vw,44px)}
.cd .lead{font-size:17.5px;color:var(--ink-2);margin-top:14px;max-width:60ch}
.cd h2{font-size:22px;margin:40px 0 16px}
.hrsbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:6px}
.hrsbar i{display:block;height:100%}
.mods{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mod{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);font-size:15px}
.mod:first-child{border-top:0}
.mod i{width:10px;height:10px;border-radius:3px}
.mod .h{color:var(--muted);white-space:nowrap}
.mods .tot{display:flex;justify-content:space-between;padding:14px 20px;background:var(--band);font-weight:700}
.outs{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.outs li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink-2)}
.outs .icon{color:#16733B;margin-top:5px}
@media (max-width:960px){.cd{grid-template-columns:1fr}.cd-side{position:static;order:-1}.cd-side .poster{max-width:340px}}
@media (max-width:560px){.outs{grid-template-columns:1fr}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input,.field select,.field textarea{height:48px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--bg);outline:none;font-weight:400}
.field textarea{height:100px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.ok-msg{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-s);background:#E7F6EC;color:#14532D;font-size:15px}

.modal.lb{background:rgba(8,9,20,.88)}

/* banner */

/* word reveal */
.sw .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-block:.06em .12em;margin-block:-.06em -.12em}

.ws-list .bar i{}

@media (max-width:560px){.hdr .wrap{gap:10px}.brand small{display:none}.brand b{font-size:15px}.brand .logo{height:44px}.lang .lf{display:none}.lang .ls{display:inline}.hdr-cta{gap:6px}.hdr-cta .btn-s{padding:0 12px}}

/* ---- popup visibility fix: honour [hidden] despite .pop{display:flex} ---- */
.pop[hidden]{display:none}

/* ---- intro reveal (shown once per session) ---- */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(130% 100% at 50% 0,#20265C 0,#171B47 55%,#0E1133 100%);
  transition:transform .85s cubic-bezier(.76,0,.24,1),opacity .6s ease .25s}
#intro.done{transform:translateY(-100%);opacity:0;pointer-events:none}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;padding:24px}
.intro-badge{position:relative;width:min(188px,44vw);aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:28px;
  box-shadow:0 34px 80px -34px rgba(0,0,0,.65);transform:scale(.7);opacity:0;animation:introPop .9s cubic-bezier(.2,.8,.2,1) .15s forwards}
.intro-badge::after{content:"";position:absolute;inset:-3px;border-radius:31px;border:2px solid var(--gold);opacity:0;animation:introRing 1s ease .55s forwards}
.intro-badge img{width:84%;height:auto}
.intro-line{display:flex;gap:.38em;flex-wrap:wrap;justify-content:center;font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(30px,7.5vw,66px);letter-spacing:.02em;color:#fff;line-height:1;direction:ltr}
.intro-line b{color:var(--gold);font-weight:400}
.intro-line span{display:inline-block;opacity:0;transform:translateY(32px);animation:introWord .7s cubic-bezier(.2,.8,.2,1) forwards}
.intro-line span:nth-child(1){animation-delay:.52s}
.intro-line span:nth-child(2){animation-delay:.7s}
.intro-line span:nth-child(3){animation-delay:.88s}
.intro-skip{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));inset-inline-end:18px;color:rgba(255,255,255,.7);
  font-size:13px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 16px;opacity:0;animation:introWord .5s ease 1.15s forwards}
.intro-skip:hover{color:#fff;border-color:#fff}
@keyframes introPop{to{transform:scale(1);opacity:1}}
@keyframes introRing{to{opacity:.9;inset:-9px}}
@keyframes introWord{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro{display:none!important}}

/* ---- announcement -> live notification bar ---- */
.ann{background:linear-gradient(90deg,#171B47,#20265C);color:#fff;font-size:13.5px;padding-block:9px;position:relative;overflow:hidden}
.ann::before{content:"";position:absolute;top:0;bottom:0;width:38%;left:-38%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(242,183,5,.16),transparent);animation:annShine 5.5s ease-in-out infinite}
@keyframes annShine{0%{left:-38%}55%,100%{left:120%}}
.ann .wrap{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap}
.ann-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 0 0 rgba(242,183,5,.6);animation:annPulse 1.8s ease-out infinite}
@keyframes annPulse{to{box-shadow:0 0 0 7px rgba(242,183,5,0)}}
.ann-tag{background:var(--gold);color:#171B47;font-weight:800;font-size:10.5px;letter-spacing:.08em;padding:2px 8px;border-radius:5px;flex:none;direction:ltr}
.ann-txt{color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ann a.ann-cta:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){.ann{font-size:12.5px}.ann .wrap{gap:7px}.ann-txt{max-width:50vw}}

/* ---- AI assistant fab + popup header ---- */

/* ---- hero typewriter caret (gold) ---- */

/* ---- gold brand touches ---- */

/* ---- past-rounds showcase (photo/poster + stats + rating, framed) ---- */
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.rc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}

.rc-tag{position:absolute;top:12px;inset-inline-end:12px;z-index:2;background:rgba(255,255,255,.94);color:var(--brand);font-weight:700;font-size:12px;padding:4px 11px;border-radius:999px}

.rc-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}

/* ---- intro cover: promo + clearer skip ---- */
.intro-badge{width:min(132px,32vw)}

.rc-yr{position:absolute;top:12px;inset-inline-end:12px;z-index:2;background:rgba(255,255,255,.94);color:var(--brand);font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px;direction:ltr}

.dash-panels{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media(max-width:820px){.dash-panels{grid-template-columns:1fr}}
.dash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.dash-card h4{font-size:15px;margin-bottom:20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .bar i{display:block;width:100%;max-width:40px;background:linear-gradient(180deg,#3a4186,#171B47);border-radius:6px 6px 0 0;min-height:4px}
.bars .bar .bv{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.bars .bar .bl{font-size:12px;color:var(--ink-2);font-weight:700;direction:ltr}
.splitv{display:flex;flex-direction:column;justify-content:center;height:100%;gap:18px}
.split-bar{display:flex;height:18px;border-radius:999px;overflow:hidden}
.split-bar .e{background:var(--brand)}.split-bar .m{background:var(--gold)}
.split-leg{display:flex;flex-direction:column;gap:12px}
.split-leg div{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.split-leg b{font-weight:800}
.split-leg .dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-inline-end:8px;vertical-align:-1px}
.split-leg .dot.e{background:var(--brand)}.split-leg .dot.m{background:var(--gold)}

/* ---- entry promo as a blurred modal ---- */
#intro{background:rgba(10,12,28,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity .5s ease}
#intro.done{transform:none;opacity:0;pointer-events:none}
.intro-card{position:relative;background:linear-gradient(160deg,#222a63,#141737);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:40px 28px 30px;max-width:470px;width:calc(100% - 32px);box-shadow:0 50px 120px -30px rgba(0,0,0,.75);text-align:center;opacity:0;transform:translateY(14px);animation:cardIn .55s ease .05s forwards}
@keyframes cardIn{to{opacity:1;transform:none}}
.intro-card .intro-in{max-height:none;overflow:visible;gap:20px;padding:0}
.intro-card .intro-badge{width:116px}
.intro-card .intro-line{font-size:clamp(23px,5.2vw,40px)}
.intro-card .intro-skip{position:absolute;top:13px;inset-inline-end:13px}
.intro-card .intro-promo{max-width:none;width:100%}

/* ---- hero electric motif + rotating typewriter ---- */
.hero-art .orb{position:absolute;width:80%;aspect-ratio:1;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,rgba(23,27,71,0),rgba(242,183,5,.22),rgba(23,27,71,0),rgba(47,54,114,.26),rgba(23,27,71,0));filter:blur(16px);animation:spin 16s linear infinite;z-index:0}
.hero-art .ring{position:absolute;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none}
.hero-art .ring.r1{width:90%;aspect-ratio:1;border:1.5px dashed rgba(23,27,71,.16);animation:spin 28s linear infinite}
.hero-art .ring.r2{width:112%;aspect-ratio:1;border:1.5px dashed rgba(242,183,5,.26);animation:spin 40s linear infinite reverse}
.hero-art img{position:relative;z-index:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hero-rot{margin-top:16px;font-size:clamp(17px,2.3vw,23px);font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:1.7em}
.hero-rot>span{color:var(--muted);font-weight:600}
.hero-rot b{color:var(--brand);font-weight:800}
.hero-rot .caret{height:1em;margin-inline-start:2px}
@media (prefers-reduced-motion:reduce){.hero-art .orb,.hero-art .ring{animation:none}}
.hero-art .tri{position:absolute;z-index:0;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:0 14px 30px -14px rgba(14,15,26,.3)}
.hero-art .t1{width:clamp(70px,11vw,118px);aspect-ratio:1;background:linear-gradient(155deg,#343c82,#171B47);top:-2%;right:2%;border-radius:14px;animation:floaty 7s ease-in-out infinite}
.hero-art .t2{width:clamp(50px,8vw,84px);aspect-ratio:1;background:linear-gradient(155deg,#F7C838,#E3A200);bottom:3%;left:0;border-radius:12px;animation:floaty 9s ease-in-out infinite reverse}
.hero-art .t3{width:clamp(38px,6vw,62px);aspect-ratio:1;background:#DEE1F2;top:56%;right:-2%;border-radius:10px;animation:floaty 8s ease-in-out .6s infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.hero-art .tri{animation:none}}
@media (max-width:860px){.hero-art .tri{display:none}}

/* choose-your-track: icons + top accent */
.cat{position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--brand),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.cat:hover::before{transform:scaleX(1)}
.cat-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,#EEF0FA,#F7F2E2);color:var(--brand);border:1px solid var(--line);margin-bottom:6px}
.cat-ic svg{width:25px;height:25px}

<script>
(function(){
  var el=document.getElementById('intro');if(!el)return;
  var seen=false;try{seen=sessionStorage.getItem('dk-intro')==='1';}catch(e){}
  var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  /* DEMO: shows on every load so it's easy to preview. For production, change to (seen||reduce) to show once per session (admin-controlled later). */
  if(reduce){if(el.parentNode)el.parentNode.removeChild(el);return;}
  /* featured-course promo on the cover */
  try{
    var st=(window.DK&&DK.load)?DK.load():null;
    if(st&&st.courses){
      var lang='en';try{lang=localStorage.getItem('dk-lang')==='ar'?'ar':'en';}catch(e){}
      var op=st.courses.filter(function(c){return c.status==='open'&&c.featured&&!c.hidden;});
      op.sort(function(a,b){return (b.ribbon?1:0)-(a.ribbon?1:0);});
      var c=op[0];
      if(c){
        var a=document.createElement('a');a.className='intro-promo';a.href='#course-'+c.id;a.dir=lang==='ar'?'rtl':'ltr';
        var img=document.createElement('img');img.src=c.image||'assets/logo.png';img.alt='';
        var b=document.createElement('span');b.className='ip-b';
        var k=document.createElement('span');k.className='ip-k';k.textContent=lang==='ar'?'مفتوح للتسجيل':'Open for registration';
        var tt=document.createElement('span');tt.className='ip-t';tt.textContent=lang==='ar'?c.title:(c.title_en||c.title);
        var cta=document.createElement('span');cta.className='ip-cta';cta.textContent=(lang==='ar'?'سجّل الآن':'Register now')+' →';
        b.appendChild(k);b.appendChild(tt);b.appendChild(cta);a.appendChild(img);a.appendChild(b);
        el.querySelector('.intro-in').appendChild(a);
      }
    }
  }catch(e){}
  var killed=false;
  function done(){if(killed)return;killed=true;el.classList.add('done');try{sessionStorage.setItem('dk-intro','1');}catch(e){}try{window.dispatchEvent(new Event('dk-intro-done'));}catch(e){}setTimeout(function(){if(el&&el.parentNode)el.parentNode.removeChild(el);},900);}
  var timer=setTimeout(done,4800);
  el.addEventListener('click',function(){clearTimeout(timer);done();});
})();
</script>

<script>
(function(){
'use strict';
var S=DK.load(), VIEW=document.getElementById('view'), user=null, LANG='en';
try{user=JSON.parse(localStorage.getItem('dk-user')||'null');}catch(e){}
try{LANG=localStorage.getItem('dk-lang')==='ar'?'ar':'en';}catch(e){}
function norm(){S.courses.forEach(function(c){c.mode=c.mode||[];c.modules=c.modules||[];c.poster=c.poster||{a:'#262A5C',b:'#F2B705',mark:''};c.outcomes=c.outcomes||[];});['reviews','partners','faq','archive','leads'].forEach(function(k){S[k]=S[k]||[];});}
norm();

/* ---------- language ---------- */
function t(en,ar){return LANG==='ar'?ar:en;}
function L(o,f){if(!o)return '';var v=o[f+'_en'];if(LANG==='en'&&v!=null&&v!=='')return v;return o[f]==null?'':o[f];}
function ML(m){return LANG==='en'?(DK.modeEn[m]||m):m;}
function SL(s){return (LANG==='en'?DK.statusLabelEn:DK.statusLabel)[s]||'';}
function KL(k){return (LANG==='en'?DK.kindLabelEn:DK.kindLabel)[k]||'';}
function OUT(c){return LANG==='en'&&c.outcomes_en?c.outcomes_en:c.outcomes;}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(v){return Number(v||0).toLocaleString('en-US');}
function ic(id,cls){return '<svg class="icon'+(cls?' '+cls:'')+'"><use href="#'+id+'"/></svg>';}
function arrow(){return ic('i-arrow','ia');}
function cat(id){for(var i=0;i<S.categories.length;i++)if(S.categories[i].id===id)return S.categories[i];return {name:'',desc:''};}
function course(id){for(var i=0;i<S.courses.length;i++)if(S.courses[i].id===id)return S.courses[i];return null;}
function fmtDate(d){if(!d)return '';try{return new Date(d+'T00:00:00').toLocaleDateString(LANG==='ar'?'ar-EG-u-nu-latn':'en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function live(){return S.courses.filter(function(c){return c.status!=='done'&&!c.hidden;});}
function byStart(a,b){return (a.start||'9999')<(b.start||'9999')?-1:1;}
function initials(name){var p=String(name).replace(/^(م\.|Eng\.)\s*/,'').split(' ');return (p[0]||'').charAt(0)+(p[1]?p[1].charAt(0):'');}
function stars(k){var h='';for(var i=1;i<=5;i++)h+='<svg class="'+(i<=k?'':'off')+'" viewBox="0 0 24 24"><use href="#i-star"/></svg>';return '<div class="stars" aria-label="'+k+'/5">'+h+'</div>';}
function toast(x){var el=document.createElement('div');el.className='toast';el.textContent=x;document.body.appendChild(el);setTimeout(function(){el.remove();},2500);}
function waLink(x){return 'https://wa.me/'+encodeURIComponent(S.settings.whatsapp)+'?text='+encodeURIComponent(x||'');}
function waIcon(sz){return '<svg viewBox="0 0 24 24" fill="currentColor" width="'+(sz||18)+'" height="'+(sz||18)+'"><use href="#i-wa"/></svg>';}
function hello(){return t('Hello, ','السلام عليكم، ');}

/* ---------- poster + card ---------- */
function arNum(s){return esc(s).replace(/(\d+)/g,'<b>$1</b>');}
function poster(c){
  var p=c.poster||{}, rib=c.ribbon?'<span class="ribbon">'+esc(c.ribbon)+'</span>':'';
  if(c.image)return '<div class="poster img">'+rib+'<img src="'+esc(c.image)+'" alt="'+esc(L(c,'title'))+'" loading="lazy"></div>';
  var en=p.en||(c.roundNo?'ROUND '+c.roundNo:(p.mark||c.title));
  var season=esc(p.season||'').replace(/(\d{4})/,'<b>$1</b>');
  var cta=c.status==='open'?'APPLY NOW':c.status==='soon'?'SOON':'CLOSED';
  return '<div class="poster gen">'+rib+'<span class="dar">DAR<br>DAR<br>DAR</span><span class="dar d2">DAR<br>DAR<br>DAR</span>'+
    '<img class="pl" src="assets/logo-sm.png" alt="">'+(season?'<div class="season">'+season+'</div>':'')+
    '<div class="en">'+esc(en)+'</div><div class="ar">'+arNum(c.title)+'</div>'+(p.modeEn?'<div class="md">'+esc(p.modeEn)+'</div>':'')+
    '<span class="apply">'+cta+'</span><span class="handle">'+esc(S.settings.handle||'@daralkahrabaa')+'</span></div>';
}
function card(c){
  var left=(c.seats||0)-(c.booked||0), hrs=DK.totalHours(c);
  return '<article class="card"><a href="#course-'+esc(c.id)+'" aria-label="'+esc(L(c,'title'))+'">'+poster(c)+'</a>'+
    '<div class="card-b"><div><span class="tag '+esc(c.status)+'">'+esc(SL(c.status))+'</span></div>'+
    '<h3><a href="#course-'+esc(c.id)+'">'+esc(L(c,'title'))+'</a></h3><div class="sub">'+esc(L(c,'subtitle'))+'</div>'+
    '<div class="facts"><span>'+ic('i-clock')+(c.kind==='program'?esc(L(c,'duration')):hrs+' '+t('training hours','ساعة تدريبية')+' · '+esc(L(c,'duration')))+'</span>'+
      '<span>'+ic('i-cal')+esc(c.start?t('Starts ','يبدأ ')+fmtDate(c.start):L(c,'schedule'))+'</span>'+
      (c.seats&&c.status!=='done'?'<span>'+ic('i-users')+(left>0?t(left+' of '+c.seats+' seats left','متبقي '+left+' مكان من '+c.seats):t('Fully booked','اكتمل العدد'))+'</span>':'')+'</div>'+

function dashStats(){

  return {sc:sc,g:g,e:e,m:m,avg:sc.length?r/sc.length:0};
}
function dashTiles(){
  var d=dashStats();if(!d.sc.length)return '';

  return '<div class="dash-tiles">'+tile('+'+n(d.g),t('graduates','خريج'))+tile(d.sc.length,t('rounds shown','راوند'))+tile('+'+n(d.e),t('electrical','كهرباء'))+tile('+'+n(d.m),t('mechanical','ميكانيكا'))+tile(d.avg.toFixed(1)+'★',t('avg rating','متوسط التقييم'))+'</div>';

function route(keepScroll){
  var h=(location.hash||'#home').slice(1), html, r='';
  if(h.indexOf('course-')===0){html=pageCourse(h.slice(7));r='courses';}
  else if(h.indexOf('courses')===0){F.cat=h.split('-')[1]||'all';html=pageCourses();r='courses';}
  else if(h==='rounds'){html=pageRounds();r='rounds';}
  else if(h==='reviews'){html=pageReviews();}
  else if(h==='about'){html=pageAbout();r='about';}
  else if(h==='faq'){html=pageFaq();r='faq';}
  else if(h==='contact'){html=pageContact();r='contact';}
  else html=pageHome();
  VIEW.innerHTML=html;
  document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-r')===r);});
  if(h.indexOf('courses')===0)renderGrid();
  heroRotate();
  motion(keepScroll);
}

function recommend(tags,mode){
  var l=live();
  if(tags.indexOf('next')>-1)return l.filter(function(c){return c.start||c.status==='soon';}).sort(byStart).slice(0,3);
  return l.map(function(c){var s=0;tags.forEach(function(x){if(c.cat===x)s+=2;if((c.tags||[]).indexOf(x)>-1)s+=3;});if(mode)s+=(c.mode||[]).indexOf(mode)>-1?2:-4;if(c.status==='open')s+=1;return {c:c,s:s};})
    .filter(function(x){return x.s>1;}).sort(function(a,b){return b.s-a.s;}).slice(0,3).map(function(x){return x.c;});
}

/* ---------- motion: entrance, scroll reveal, count-up ---------- */
function splitWords(el){
  if(el.getAttribute('data-split'))return;el.setAttribute('data-split','1');
  (function walk(node){[].slice.call(node.childNodes).forEach(function(c){
    if(c.nodeType===3){var parts=c.textContent.split(/(\s+)/),f=document.createDocumentFragment();
      parts.forEach(function(p){if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return;}var w=document.createElement('span');w.className='w';var i=document.createElement('span');i.textContent=p;w.appendChild(i);f.appendChild(w);});
      node.replaceChild(f,c);}
    else if(c.nodeType===1&&c.tagName!=='BR')walk(c);});})(el);
  [].forEach.call(el.querySelectorAll('.w>span'),function(s,i){s.style.transitionDelay=Math.min(i,14)*45+'ms';});
}
/* hero headline: typed word-by-word with a gold caret, after the intro lifts */
function typeHero(){
  var el=VIEW.querySelector('.hero h1');if(!el)return;
  splitWords(el);
  var spans=[].slice.call(el.querySelectorAll('.w>span'));if(!spans.length)return;
  spans.forEach(function(s){s.style.transition='opacity .16s ease';s.style.transform='none';s.style.transitionDelay='0ms';s.style.opacity='0';});
  var caret=document.createElement('span');caret.className='caret';el.appendChild(caret);
  var started=false;
  function run(){if(started||!document.body.contains(el))return;started=true;var i=0;
    (function step(){if(!document.body.contains(el))return;if(i<spans.length){spans[i].style.opacity='1';i++;setTimeout(step,100);}})();}
  var intro=document.getElementById('intro');
  if(intro&&!intro.classList.contains('done')){window.addEventListener('dk-intro-done',run,{once:true});setTimeout(run,5200);}
  else{setTimeout(run,160);}
}
/* hero rotating typewriter (loops through the tracks, like a BD-style hero) */
function typeLoop(el,ph){
  var i=0,j=0,del=false;
  (function tick(){
    if(!document.body.contains(el))return;
    var p=ph[i%ph.length];
    j=del?j-1:j+1;el.textContent=p.slice(0,Math.max(0,j));
    var d=del?45:95;
    if(!del&&j>=p.length){del=true;d=1400;}
    else if(del&&j<=0){del=false;i++;d=320;}
    setTimeout(tick,d);
  })();
}
function heroRotate(){
  var el=document.getElementById('heroRot');if(!el)return;
  var ph=LANG==='ar'?['تصميم الكهرباء','التيار الخفيف','التسعير والتنفيذ','الميكانيكا و HVAC','الشوب دروينج']:['Electrical design','Low current systems','Pricing & execution','Mechanical & HVAC','Shop drawings'];
  var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce){el.textContent=ph[0];return;}
  typeLoop(el,ph);
}
function motion(skipReveal){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;io.unobserve(en.target);var el=en.target;
    if(el.classList.contains('sw')||el.classList.contains('rvz')){el.classList.add('in');}
    if(el.classList.contains('rv')){var sib=[].indexOf.call(el.parentNode.children,el);el.style.transitionDelay=Math.min(sib,5)*70+'ms';el.classList.remove('pre');setTimeout(function(){el.style.transitionDelay='';},1200);}
    if(el.hasAttribute('data-count')){var to=+el.getAttribute('data-count'),suf=el.getAttribute('data-suf')||'',t0=performance.now();(function tick(tm){var p=Math.min(1,(tm-t0)/1300),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=n(v)+suf;if(p<1)requestAnimationFrame(tick);})(t0);}
  });},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  if(skipReveal)return;
  var vh=window.innerHeight;
  typeHero();
  VIEW.querySelectorAll('.head h2,.ws h2,.phead h1,.cd h1').forEach(function(el){splitWords(el);el.classList.add('sw');
    if(el.getBoundingClientRect().top<vh*0.95){setTimeout(function(){el.classList.add('in');},60);}else io.observe(el);});
  var bn=VIEW.querySelector('.bn');if(bn){if(bn.getBoundingClientRect().top<vh*0.95)bn.classList.add('in');else{bn.classList.add('rvz');io.observe(bn);}}
  VIEW.querySelectorAll('.head p,.cat,.card,.rc,.rev,.nums>div,.why>div,.tbl-wrap,.qa,.mods,.box,.person,.ws-list li,.gal .ph,.ws-photos .ph').forEach(function(el){
    el.classList.add('rv');if(el.getBoundingClientRect().top>vh*0.92){el.classList.add('pre');io.observe(el);}
  });
  VIEW.querySelectorAll('[data-count]').forEach(function(el){if(el.getBoundingClientRect().top>vh*0.92)io.observe(el);});
}
var hdr=document.querySelector('.hdr');window.addEventListener('scroll',function(){hdr.classList.toggle('scrolled',scrollY>8);},{passive:true});

applyLang();chrome();route();
})();
